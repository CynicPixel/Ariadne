graphs:   # ARIADNE_PGO_SESYNC=/data/code/Ariadne/.cache/oracle/pgo_sesync (infra/scripts/models.sh pgo-sesync)
  sphere2500: sha256:eda250de1daa50dc37968f1127641eb8575dc72a643d08dc97372fe2c51d9184
  torus3D:    sha256:ac2d46823ccc9fcf6259d19a3917ef4c78a61f943d8848d0b519a9f3bb84ad81
  cubicle:    sha256:a31831d47da98e2dfe986e707b4b92f0a5a6f37e3a9370e80c65266c30c5979d
  rim:        sha256:ddace79a7cd86168188f6676524658bfbebca4bf9b92c93391785eae4eaaf731
  grid3D:     sha256:e850bac2a587a5385906bcd273bdd311a5a66b426c502f7649abd44c2c314f95

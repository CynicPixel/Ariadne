command: evaluation/runs/2.5/certificate_sesync/run_one.sh <stem> [cap]   # repo root; cap default 6g
git_commit: f8c7030   # main after the 2.5 merge; run from feat/live-runtime at 8f54d0e (docs-only on top)
binary: build/docker/tests/test_opencv sha256:d1b2fdcb3566ecb4c2411520624c5b2e69637d9bbf813df341e25dea3c2b12f1
binary_built_at: e078376   # cpp/slam, cpp/core and tests/unit/test_certificate.cpp are unchanged e078376..f8c7030

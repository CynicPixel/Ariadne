# Test config for python/orchestration/fake_orchestrator.py (no Bedrock). threshold 0.3 so the L1 recording has
# above-threshold candidates (max 0.49) for the approval branches; NOT a mission setting.
# The live closed-loop runtime (design LIVE_RUNTIME_L1 D152-D154). The mapping / frontier / routing values are
# configs/mission/mission_v1.yaml's (the 1.8 layer, unchanged); these are the live-only knobs.
name: live_llm_fake_test
end_s: 45.0                  # sim seconds: frames stamped later are not consumed; then every agent is told hold()
lens: false                  # D227 (D41 amendment, maintainer-directed 2026-10-24): the read-time synthetic lens
                             # is OFF in the live runtime; frames stay the clean render, calibration reports D = 0.
chooser: llm                 # classical = the nearest reachable frontier at least min_goal_m away; 7.1 adds the orchestrator
command:
  max_length_m: 3.0          # a follow() is cut here: at <= 0.6 m/s that is ~5 s of motion, one replan period, so
                             # the next decision always arrives before the agent runs out of path (receding horizon)
  simplify_eps_cells: 1.0    # cv::approxPolyDP tolerance on the A* cell path; each chord re-checked on the grid
  face_frontier: true        # the last pose turns to face the chosen cluster's centroid (observe what was approached)
  min_goal_m: 1.0            # candidates nearer than this are not driven to. Measured 2026-10-23 (first live smoke):
                             # the nearest cluster is ALWAYS the one under the agent (path 0 m: the unknown band behind
                             # and beside a 90-degree forward rig), so 1.8's nearest rule, executed, never moves.
                             # 1.0 m = 2.5 rho_responder: past the agent's own footprint band.
  # Standoff goals (D153b, after the 30 s acceptance run of 2026-10-23: from t = 10 s every follow ended ON a frontier cell
  # next to an unseen wall and the mover refused it, 10/10). Goals now lie in KNOWN free space with rho_agent clearance
  # to anything not observed free, as near the cluster as that allows.
  escape_m: 0.5              # the agent may leave its own spot through trav_a within this radius (the unseen space
                             # behind a forward rig makes its own cell unsafe under the conservative rule)
  max_standoff_m: 2.0        # a cluster with no safe cell within this distance is not a candidate (~2/3 of the
                             # 2.84 m carving range: the frontier stays inside what one keyframe can map)
  refused_radius_m: 0.5      # a goal within this of a goal the mover refused (same agent) is not re-chosen
risk_gate:
  autonomous_threshold: 0.3  # TEST: see the header
llm:
  timeout_s: 5.0            # TEST ONLY: the scripted malformed answer waits out the timeout
reorder:
  hold_back_ms: 3000         # a timed topic silent for this long stops holding the watermark (logged)
telemetry_hz: 5.0            # console pose rate, in sim time

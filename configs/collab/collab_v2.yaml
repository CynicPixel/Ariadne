# 3.2 sim integration, pass B (ariadne_collab_sim; design collaboration.md#simulated-collaboration, D171). The sweep (infra/eval/collab_aws.sh)
# writes one copy per run with arm / budget / ratio / scenario filled in; these are the shared values.
arm: similarity                 # similarity (no budget: every candidate) | greedy (SelectBySimilarity) | spectral (D170)
# budget_bytes_per_s / budget_burst_bytes / budget_source: required for greedy and spectral; derived per D171 §4
# (fractions of the similarity arm's measured fetch rate on the OTHER scene; burst = one selection period)
# response_ratio / calibration_run: the MATCH_RESPONSE compression ratio measured on the OTHER scene (collaboration.md §7)
comms_scenario: configs/comms/collapsed_v1.yaml
dt_s: 0.02                      # sim step (D171 §1); 20 ms << the 1 s heartbeat and the 5 s selection period
drain_s: 30.0                   # after the last release, before the §6 outcome
ate_every_s: 1.0
selection_interval_s: 5.0       # Swarm-SLAM's period (D170)
candidate_ttl_s: 120.0          # [ASSUMPTION] D170; the sim runs report how many expire
refine_passes: 2                # D170
local_encoding: int8            # arch §15.7 default (per-keyframe scale); fp16 = the ablation row. D171: identical
                                # LightGlue match sets to fp32 on the D90 sim pairs (LocalDescriptorCodec test)
robust: true                    # PCM -> chordal re-init -> GNC-TLS (D76); false = the plain-PGO ablation row
entry_gate: {enabled: false, chi2: 22.4577, entry_sigma_m: 0.10, entry_sigma_deg: 2.0, kappa: 2.9447}   # D178: known-start
                                # Mahalanobis gate (chi2_6 0.999; kappa from the scene-1 NEES calibration); default off
retrieval:
  min_score: 0.8                # Swarm-SLAM's stereo similarity_threshold (cslam_experiments kitti_stereo.yaml, on
                                # CosPlace, EigenPlaces' predecessor from the same group); sim check via edges.csv
  top_k: 3                      # [ASSUMPTION] as the intra-agent loop closure (euroc_v2_loops.yaml)
verify:                         # the 1.6 verifier's gates (edge_verifier.hpp defaults); recalibration on the other
  min_matches: 40               # scene is D171 §2 (edges.csv carries the per-candidate GT errors it needs)
  essential_threshold_px: 1.0
  min_essential_inliers: 30
  min_essential_inlier_ratio: 0.4
  pnp_reprojection_px: 2.0
  min_pnp_inliers: 25
gate:                           # D71 gate + the loop noise model; EuRoC-fitted values (euroc_v2_loops.yaml),
  noise_model: true             # carried to the sim [ASSUMPTION until the sim fit from edges.csv]
  noise_k_t: 1.33
  noise_floor_t_m: 0.014
  noise_k_r: 0.178
  noise_floor_r_rad: 0.0095

# Placeholder front-end tuned for EuRoC MAV (752x480, rectified f ~ 435-460 px,
# B = 0.110 m). A DATASET config: its range requirement describes what EuRoC's
# geometry allows, not the §9.4 collapsed-void mission requirement (0.30 m),
# which lives in placeholder.yaml. Bending the mission config to fit a dataset
# would hide exactly the blind zone §9.4 exists to expose. (D35)
name: euroc

features:
  grid_cols: 8
  grid_rows: 6
  max_keypoints: 1000           # ORB-SLAM3 uses 1200 ORB features at this resolution
  detect_oversample: 4
  orb_fast_threshold: 20
  orb_fast_threshold_min: 7
  orb_levels: 8
  orb_scale_factor: 1.2
  orb_patch_size: 31

tracker:
  win_size: 21
  max_level: 3
  term_max_iterations: 30
  term_epsilon: 0.01
  min_eig_threshold: 1.0e-4
  fb_threshold_px: 0.5
  border_px: 1
  target_tracks: 400            # VINS-Fusion ~150, OpenVINS ~200 at 752x480; 1200 cannot fit at 20 px spacing
  min_track_distance_px: 20.0
  replenish_request_factor: 4
  f_ransac_threshold_px: 1.0
  f_confidence: 0.99
  f_max_iterations: 1000
  f_min_points: 15
  degraded_min_tracks: 30

stereo:
  min_disparity: 0
  num_disparities: 96           # Z_min ~0.5 m at fB ~48 px; blinds 96/752 = 13% of columns
  block_size: 5
  p1_coefficient: 8.0
  p2_coefficient: 32.0
  uniqueness_ratio: 15
  speckle_window_size: 200
  speckle_range: 2
  disp12_max_diff: 1
  pre_filter_cap: 63
  mode: sgbm_3way
  sigma_disparity_px: 0.5
  required_min_range_m: 0.60    # dataset geometry, not the mission requirement
  support_window_px: 31
  support_min_density: 0.75

stereo_match:                   # keyframe left->right LK correspondence (validated on EuRoC, D35)
  win_size: 21
  max_level: 3
  fb_threshold_px: 0.5
  max_dy_px: 1.0                # rectified pair: a correct match stays on its row
  row_refinement: true          # fit the residual rectification dy = a+bx+cy at the first keyframes (D54)
  row_search_px: 4.0            # matches considered for that fit: |dy| <= this
  row_min_matches: 100
  row_min_span: 0.5             # matches must span half the image to fit the slopes, else only the offset
  exposure_match: true          # left/right gain-bias match before stereo LK + SGBM (per-camera auto-exposure)

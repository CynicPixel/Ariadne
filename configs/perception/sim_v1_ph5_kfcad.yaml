# Phase 5 §31.5 row config (D145-D147): the features row BASELINE: sim_v1_rad_flat at the keyframe cadence, Stage 3 off (D146).
# Generated from sim_v1_rad_flat.yaml; identical to it except where marked.
# Placeholder front-end for the simulated rig (rig_stereo_v1 + read-time lens,
# D41): 1280x720, rectified f ~ 672 px, B = 0.100 m. Derived from euroc.yaml
# (validated on MH_01); only resolution- and geometry-dependent values change.
# Unlike a dataset config, the sim IS the mission geometry, so the range
# requirement is §9.4's 0.30 m.
name: sim_v1_ph5_kfcad

features:
  grid_cols: 12
  grid_rows: 7
  max_keypoints: 1500           # 2.6x the pixels of EuRoC; ORB-SLAM3 uses 1200-2000 at 720p
  detect_oversample: 4
  orb_fast_threshold: 20
  orb_fast_threshold_min: 7
  orb_levels: 8
  orb_scale_factor: 1.2
  orb_patch_size: 31

tracker:
  win_size: 21
  max_level: 3
  term_max_iterations: 30
  term_epsilon: 0.01
  min_eig_threshold: 1.0e-4
  fb_threshold_px: 0.5
  border_px: 1
  target_tracks: 500            # euroc 400, scaled for 1280x720 at 25 px spacing
  min_track_distance_px: 25.0
  replenish_request_factor: 4
  replenish: keyframe           # D146 features row: detection only at keyframes, where the proxy exists
  replenish_min_tracks: 375     # 75 % of target_tracks, the euroc_v2_xfeat convention (PERCEPTION_2.1 §9.10)
  f_ransac_threshold_px: 1.0
  f_confidence: 0.99
  f_max_iterations: 1000
  f_min_points: 15
  degraded_min_tracks: 30

stereo:
  min_disparity: 0
  num_disparities: 240          # Z_min = 671.5*0.1/239 = 0.281 m (rectified f, §9.4); blinds 240/1280 = 19% of columns
  block_size: 5
  p1_coefficient: 8.0
  p2_coefficient: 32.0
  uniqueness_ratio: 15
  speckle_window_size: 200
  speckle_range: 2
  disp12_max_diff: 1
  pre_filter_cap: 63
  mode: sgbm_3way
  sigma_disparity_px: 0.5
  required_min_range_m: 0.30    # §9.4 collapsed-void requirement
  support_window_px: 31
  support_min_density: 0.75

stereo_match:                   # keyframe left->right LK correspondence (validated on EuRoC, D35)
  win_size: 21
  max_level: 3
  fb_threshold_px: 0.5
  max_dy_px: 1.0                # rectified pair: a correct match stays on its row
  row_refinement: true          # fit the residual rectification dy = a+bx+cy at the first keyframes (D54)
  row_search_px: 4.0            # matches considered for that fit: |dy| <= this
  row_min_matches: 100
  row_min_span: 0.5             # matches must span half the image to fit the slopes, else only the offset
  exposure_match: true          # left/right gain-bias match before stereo LK + SGBM (per-camera auto-exposure)

# 2.2 radiometric front end (D67): stage 1 only: the camera's calibrated flat field, no VST.
# Identical to sim_v1.yaml above this section.
radiometric:
  mode: flat_only

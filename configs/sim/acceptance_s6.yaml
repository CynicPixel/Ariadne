# Pass thresholds for the 1.1 acceptance test (design SIM_1.1-1.3 §6), checked by
# cpp/runtime/tools/ariadne_sim_calib. SET FROM THE FIRST MEASUREMENT (SMOKE §4n,
# ci_tiny seed 0, rig_stereo_v1 with the read-time lens, D41); the measured value
# is quoted beside each limit. CIRCULAR until the evidence run: these limits were
# derived from the same dev run that passes them; the first independent test is
# the D41-rig evidence recording. Other seeds/presets: untested.
# Failure modes each check is meant to trip — DEMONSTRATED: a 5 mm board
# misplacement (A: 2.1-2.3 px). ARGUED FROM MAGNITUDE, not demonstrated: a missing
# or wrong lens (k1 off by 0.05 -> ~23 px at the corners), a principal-point
# convention slip (0.5 px vs |mean| 0.05), a one-step (1 ms) render/pose offset
# (vs 0.5 ms), a wrong extrinsic, a rotated board texture (D flips).
name: s6_v1
min_frames_detected: 500          # per camera; measured 1041-1044
a_gt_reprojection:                # per camera and calib segment kind, against the TRUTH model
  rms_px: 0.25                    # measured <= 0.093
  abs_mean_px: 0.05               # measured <= 0.016
  abs_apparent_k1: 0.002          # measured <= 1.2e-4
  abs_time_offset_s: 0.0005       # measured <= 1.1e-6
b_free_calibration:               # tolerances, NOT sigmas: fx stays +1.3-1.8 px with 400
  rel_focal: 0.01                 # views while the formal std shrinks (z up to 6), and it
  abs_principal_point_px: 2.0     # persists with k1/k2/k3 held at truth, so it is not
  abs_k1: 0.003                   # fx-radial coupling [ASSUMPTION: fx-distance ambiguity of
  abs_k2: 0.003                   # near-frontal planar views]; check A (GT poses) is exact.
                                  # measured |dfx|/fx <= 0.0039, |dc| <= 0.93 px,
                                  # |dk1| <= 0.0006, |dk2| <= 0.0013, rms 0.070-0.071 px
  rms_px: 0.2
c_stereo_truth_intrinsics:
  t_err_m: 0.001                  # measured 9.4e-5
  rot_err_deg: 0.05               # measured 0.0036
d_pnp_vs_gt:
  mean_rot_err_deg: 1.0           # measured 0.28
  mean_t_err_m: 0.005             # measured 0.0014

# L2 (D91): the sim IMU noise operator's config (core/inertial/imu_noise_operator.hpp), applied at consumption time
# to the rig's clean IMU stream like D to the pixels: ariadne_sim_vo --imu-noise configs/sim/imu_noise_v1.yaml.
# Values: the ADIS16448 as EuRoC models it (mav0/imu0/sensor.yaml, Kalibr densities) -- a real MAV-class MEMS IMU,
# so sim and EuRoC share one noise regime. rate_hz must match the rig's imu.period_ns (5 ms).
name: imu_noise_v1
rig: rig_stereo_v1
rate_hz: 200
gyroscope_noise_density: 1.6968e-04     # rad / s / sqrt(Hz)
gyroscope_random_walk: 1.9393e-05       # rad / s^2 / sqrt(Hz)
accelerometer_noise_density: 2.0e-03    # m / s^2 / sqrt(Hz)
accelerometer_random_walk: 3.0e-03      # m / s^3 / sqrt(Hz)
gyroscope_bias_initial: [0.0, 0.0, 0.0]       # rad/s; the initialisation must find the random walk's bias
accelerometer_bias_initial: [0.0, 0.0, 0.0]   # m/s^2

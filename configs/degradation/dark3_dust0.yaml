# Ariadne degradation config: dark3_dust0
#
# Named parameter vector for the seeded degradation operator D (arch 5.6).
# Referenced by run manifests; never inline constants.
#
# Darkness: very dark: read-noise limited, near the useful floor of the sensor
# Dust:     no participating medium
#
# The sensor is IDENTICAL across every dark level: only scene radiance
# changes. Read noise therefore stays constant while the signal falls, which
# is what makes low light hard rather than merely dim.

name: dark3_dust0

# Stage 1: scene radiance
radiance_scale: 0.015

# Stages 2-3: sensor noise (fixed: same camera in every config)
enable_shot_noise: true
photon_scale: 10000.0
read_noise_electrons: 2.5

# Stage 4: optics and fixed-pattern response (fixed: same camera)
vignette_strength: 0.28
prnu_sigma: 0.012

# Stage 5-6: exposure, gain, quantization
exposure: 1.0
analog_gain: 1.0
digital_gain: 1.0
bit_depth: 8
saturation: 1.0

# Stage 7: dust
enable_dust: false
dust_beta: 0.0
